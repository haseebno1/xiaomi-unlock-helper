name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths: ["android/**", "core.py", ".github/workflows/build-apk.yml"]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Restore the toolchain cache. It is saved at the end of the job (even on failure),
      # so a failed build does not force a full 20-30 minute recompile next time.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}-

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin \
            pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential git ccache

          # Make Libtool's Autoconf macros visible to aclocal/autoreconf.
          echo "ACLOCAL_PATH=/usr/share/aclocal:/usr/share/aclocal-1.16" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer \
            "python-for-android==2024.1.21" \
            "cython<3" \
            virtualenv

      - name: Build debug APK
        run: |
          set -o pipefail
          cp core.py android/core.py
          cd android
          buildozer -v android debug 2>&1 | tee ../build.log

      - name: Show error summary
        if: failure()
        run: |
          grep -v -E "^export |^# +[A-Za-z_0-9]+ = " build.log | cut -c1-250 > clean.log
          echo "===== Gradle errors ====="
          grep -n -E "FAILURE: Build failed|What went wrong|Execution failed|Could not|licen[sc]e|Unsupported|incompatible|Failed to install|AAPT|SDK location" clean.log | head -30 || true
          echo "===== 80 lines before 'gradlew failed' ====="
          n=$(grep -n "gradlew failed" clean.log | head -1 | cut -d: -f1); n=${n:-$(wc -l < clean.log)}
          start=$((n>80 ? n-80 : 1)); sed -n "${start},$((n+3))p" clean.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-quota-helper-apk
          path: android/bin/*.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk

      # Keep this as the LAST step: saves the toolchain cache whether the build passed or failed.
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}-${{ github.run_id }}
